[project]
name = "community-bot"
version = "1.0.0"
description = "Backend core and notification worker for the Community Mini App"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram>=3,<4",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "jsonschema>=4,<5",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sentry-sdk>=2,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "structlog>=25,<26",
    "tzdata>=2025,<2027",
]

[project.scripts]
community-bootstrap-admin = "community_bot.bootstrap.initial_admin:main"
community-repair-bootstrap-admin-profile = "community_bot.bootstrap.initial_admin:repair_main"
community-bootstrap-product-config = "community_bot.bootstrap.product_config_cli:main"
community-health = "community_bot.bootstrap.health:main"
community-migrate = "community_bot.bootstrap.migrate:main"
community-migration-head = "community_bot.bootstrap.migration_head:main"
community-worker = "community_bot.worker.entrypoint:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
lint = [
    "ruff>=0.16.2",
    "ty>=0.0.69",
]
test = [
    "httpx>=0.28,<1",
    "hypothesis>=6.165.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6,<7",
    "testcontainers[postgres]>=4,<5",
]

[tool.uv]
default-groups = ["lint", "test"]
python-preference = "managed"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D100",
    "D103",
    "PLR2004",
    "S101",
]
"tests/integration/test_web_api.py" = ["PLR0915", "S105"]
"tests/unit/test_web_auth.py" = [
    "D101",
    "D102",
    "D107",
    "EM101",
    "FAST002",
    "PT011",
    "PT018",
    "PLR0915",
    "S105",
    "TRY003",
]
"tests/smoke/**/*.py" = ["S603"]
"migrations/**/*.py" = [
    "D",
    "INP001",
]
"ops/*.py" = [
    "ANN401",
    "E402",
    "EM101",
    "EM102",
    "PLR0913",
    "PLR2004",
    "S603",
    "S607",
    "T201",
    "TC003",
    "TRY003",
]
"src/community_bot/bootstrap/settings.py" = ["TC002"]
"src/community_bot/application/tasks.py" = [
    "C901",
    "D102",
    "EM101",
    "PLR0912",
    "TRY003",
]
"src/community_bot/infrastructure/db/tasks.py" = ["EM101", "TRY003"]
"src/community_bot/transport/web.py" = [
    "B008",
    "C901",
    "D101",
    "EM101",
    "FAST002",
    "PLR0911",
    "PLR0915",
    "PLR2004",
    "TC001",
    "TC003",
    "TRY003",
    "TRY004",
]

[tool.ruff.lint.isort]
known-first-party = ["community_bot"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=community_bot",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
asyncio_mode = "strict"
filterwarnings = ["error"]
markers = [
    "integration: exercises an actual PostgreSQL instance",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/community_bot"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pragma: no cover",
]
fail_under = 80
show_missing = true
