<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <title>Community — Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/mini-assets/styles.css?release=__RELEASE__">
  </head>
  <body>
    <main class="shell" id="app">
      <header class="app-header">
        <p class="eyebrow">Community</p>
        <p class="lead" id="welcome">Загружаем доступные разделы…</p>
      </header>
      <section class="screen" aria-labelledby="screen-title">
        <div class="screen-heading">
          <button class="back hidden" id="back" type="button" aria-label="Назад">←</button>
          <h1 id="screen-title">Каталог</h1>
        </div>
        <div class="screen-content" id="content" aria-live="polite"></div>
      </section>
      <nav class="bottom-nav" id="primary-navigation" aria-label="Основное меню">
        <button id="catalog-nav" type="button" aria-pressed="true"><span aria-hidden="true">▣</span>Каталог</button>
        <button id="assignments-nav" type="button" aria-label="Мои задания" aria-pressed="false"><span aria-hidden="true">▤</span>Мои</button>
        <button id="participants-nav" type="button" aria-pressed="false"><span aria-hidden="true">♧</span>Участники</button>
        <button id="profile-nav" type="button" aria-pressed="false"><span aria-hidden="true">♙</span>Профиль</button>
        <button id="moderation-nav" class="role-nav" type="button" aria-pressed="false"><span aria-hidden="true">◇</span>Модерация</button>
        <button id="management-nav" class="role-nav" type="button" aria-pressed="false"><span aria-hidden="true">⌘</span>Управление</button>
      </nav>
    </main>
    <script type="module" src="/mini-assets/app.js?release=__RELEASE__"></script>
  </body>
</html>
