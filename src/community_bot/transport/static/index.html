<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <title>Community — Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/mini-assets/theme-bootstrap.js?release=__RELEASE__"></script>
    <link rel="stylesheet" href="/mini-assets/styles.css?release=__RELEASE__">
  </head>
  <body class="app-booting">
    <div class="app-loader" id="app-loader" role="status" aria-live="polite">
      <img src="/mini-assets/onboarding-loader.png?release=__RELEASE__" alt="">
      <span>Загружаем приложение…</span>
    </div>
    <main class="shell" id="app" aria-hidden="true" hidden>
      <section class="screen" aria-labelledby="screen-title">
        <div class="screen-heading">
          <button class="back hidden" id="back" type="button" aria-label="Назад">←</button>
          <h1 id="screen-title"></h1>
        </div>
        <div class="screen-content" id="content" aria-live="polite"></div>
      </section>
      <nav class="bottom-nav" id="primary-navigation" aria-label="Основное меню" hidden>
        <button id="catalog-nav" type="button" aria-pressed="true"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5zM8 9h8M8 13h5"/></svg>Задания</button>
        <button id="participants-nav" type="button" aria-pressed="false"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM3 20a6 6 0 0 1 12 0M17 11a3 3 0 0 0 0-6M16 14a5 5 0 0 1 5 5"/></svg>Участники</button>
        <button id="profile-nav" type="button" aria-pressed="false">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
          <span>Параметры</span>
        </button>
        <button id="moderation-nav" type="button" aria-pressed="false" hidden><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 19 6v5c0 4.4-3 7.6-7 10-4-2.4-7-5.6-7-10V6l7-3ZM9 12l2 2 4-4"/></svg>Модерация</button>
      </nav>
    </main>
    <script type="module" src="/mini-assets/app.js?release=__RELEASE__"></script>
  </body>
</html>
