name: Deploy dev server (manual)

on:
  workflow_dispatch:

concurrency:
  group: canonical-dev-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure bounded SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.DEV_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
      - name: Deploy exact main SHA and prove readiness
        env:
          HOST: ${{ vars.DEV_DEPLOY_HOST }}
          USER: ${{ vars.DEV_DEPLOY_USER }}
        run: |
          set -euo pipefail
          started="$(date +%s)"
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "${USER}@${HOST}" "deploy ${GITHUB_SHA} ${started}"
