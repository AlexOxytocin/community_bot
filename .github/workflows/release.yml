name: Release image

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image_reference: ${{ steps.reference.outputs.image_reference }}
    steps:
      - name: Check out merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify pull-request CI provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ops/verify_release_provenance.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish linux/arm64 image
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: RELEASE=${{ github.sha }}
      - name: Record immutable image reference
        id: reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image_reference="ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
          echo "image_reference=${image_reference}" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${image_reference}" > community-bot-image.txt
      - name: Upload release reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: community-bot-image-${{ github.sha }}
          path: community-bot-image.txt
          retention-days: 30

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirm release commit is current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "${current_sha}" = "${GITHUB_SHA}"
      - name: Configure pinned SSH identity
        env:
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/known_hosts" "${HOME}/.ssh/deploy_key"
      - name: Deploy immutable image
        env:
          IMAGE_REFERENCE: ${{ needs.publish.outputs.image_reference }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
        run: |
          set -euo pipefail
          ssh \
            -i "${HOME}/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            "root@${PRODUCTION_HOST}" \
            "deploy ${GITHUB_RUN_NUMBER} ${GITHUB_RUN_ATTEMPT} ${GITHUB_SHA} ${IMAGE_REFERENCE}"
