name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          version: "0.12.3"
      - name: Install Python
        run: uv python install 3.13
      - name: Synchronize locked environment
        run: uv sync --locked --all-groups
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Type check
        run: uv run ty check src tests ops
      - name: Test without PostgreSQL
        run: uv run pytest -m "not integration" --no-cov

  postgresql:
    name: PostgreSQL and Alembic
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://community_bot:community_bot@localhost:5432/community_bot
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          version: "0.12.3"
      - name: Install Python
        run: uv python install 3.13
      - name: Synchronize locked environment
        run: uv sync --locked --all-groups
      - name: Validate Compose configuration
        run: docker compose config
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Exercise migrations
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Run full test suite with PostgreSQL
        run: uv run pytest
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v

  verified-merge-tree:
    name: Verified merge tree
    needs: [quality, postgresql]
    runs-on: ubuntu-latest
    steps:
      - name: Check out synthetic merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Record reviewed tree provenance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${MERGE_SHA}"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          jq -n \
            --arg repository "${REPOSITORY}" \
            --arg event "pull_request" \
            --argjson pr_number "${PR_NUMBER}" \
            --arg base_sha "${BASE_SHA}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg synthetic_merge_sha "${MERGE_SHA}" \
            --arg tree_sha "${tree_sha}" \
            --arg workflow_ref "${WORKFLOW_REF}" \
            --argjson run_id "${RUN_ID}" \
            --argjson run_attempt "${RUN_ATTEMPT}" \
            '{repository: $repository, event: $event, pr_number: $pr_number,
              base_sha: $base_sha, head_sha: $head_sha,
              synthetic_merge_sha: $synthetic_merge_sha, tree_sha: $tree_sha,
              workflow_ref: $workflow_ref, run_id: $run_id,
              run_attempt: $run_attempt}' > provenance.json
      - name: Upload reviewed tree provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-merge-tree
          path: provenance.json
          if-no-files-found: error
          retention-days: 30
