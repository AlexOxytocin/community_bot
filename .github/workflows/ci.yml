name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          version: "0.12.3"
      - name: Install Python
        run: uv python install 3.13
      - name: Synchronize locked environment
        run: uv sync --locked --all-groups
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Type check
        run: uv run ty check src tests
      - name: Test without PostgreSQL
        run: uv run pytest -m "not integration" --no-cov

  postgresql:
    name: PostgreSQL and Alembic
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://community_bot:community_bot@localhost:5432/community_bot
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          version: "0.12.3"
      - name: Install Python
        run: uv python install 3.13
      - name: Synchronize locked environment
        run: uv sync --locked --all-groups
      - name: Validate Compose configuration
        run: docker compose config
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Exercise migrations
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Run full test suite with PostgreSQL
        run: uv run pytest
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v
