name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.paths.outputs.database }}
      browser: ${{ steps.paths.outputs.browser }}
      auth_ledger: ${{ steps.paths.outputs.auth_ledger }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${BASE}" "${HEAD}")"
          match() { grep -Eq "$1" <<<"${changed}" && echo true || echo false; }
          echo "database=$(match '^(migrations/|alembic.ini|compose.*yaml|src/community_bot/infrastructure/db/)')" >> "$GITHUB_OUTPUT"
          echo "browser=$(match '^(src/community_bot/transport/static/|tests/browser/)')" >> "$GITHUB_OUTPUT"
          echo "auth_ledger=$(match '^(src/community_bot/(application|domain|infrastructure)/(auth|economy|ledger)|src/community_bot/transport/web.py|tests/(unit|integration)/test_(web_auth|economy|ledger))')" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          version: "0.12.3"
      - run: uv python install 3.13
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check --output-format=github .
      - run: uv run ty check src tests ops
      - run: uv run pytest tests/unit/test_web_auth.py --no-cov

  postgresql:
    name: PostgreSQL and Alembic
    if: needs.changes.outputs.database == 'true'
    needs: changes
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://community_bot:community_bot@localhost:5432/community_bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with: {version: "0.12.3"}
      - run: uv python install 3.13 && uv sync --locked --all-groups
      - run: docker compose up -d --wait postgres
      - run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv run pytest tests/integration/test_web_api.py --no-cov
      - if: always()
        run: docker compose down -v

  browser:
    name: Browser
    if: needs.changes.outputs.browser == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with: {version: "0.12.3"}
      - run: uv python install 3.13 && uv sync --locked --all-groups
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/browser -m browser_smoke --no-cov

  auth-ledger:
    name: Auth and ledger
    if: needs.changes.outputs.auth_ledger == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with: {version: "0.12.3"}
      - run: uv python install 3.13 && uv sync --locked --all-groups
      - run: uv run pytest tests/unit/test_web_auth.py tests/unit/test_economy_domain.py --no-cov
