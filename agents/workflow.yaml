schema_version: 1
workflow_id: community_bot.jira_development.v1
language: ru

policy_references:
  project_orchestration: agents/config.yaml#/orchestration_policy
  execution_budget: codex.agent-budget.v1
  document_routing: agents/config.yaml#/orchestration_policy/document_routing
  role_routing: agents/config.yaml#/orchestration_policy/role_routing
  continuation: agents/config.yaml#/orchestration_policy/continuation
  tool_output: agents/config.yaml#/orchestration_policy/tool_output

applicability:
  default_process_levels:
    - 1B
    - 2
    - 3
  level_1: non_behavior_documentation_only_without_jira_or_task_artifact_requirements
  level_1b: follow_adr_0010_small_reproducible_bugfix_fast_lane_with_jira_issue_and_task_branch

source_of_truth:
  current_work: jira_CB
  durable_knowledge: git_docs
  retrieval_index: mempalace_community_bot

jira_first:
  required_for:
    - bug
    - feature
    - user_story
    - runtime_behavior_change
    - workflow_change
    - development_process_change
  standing_owner_intent:
    create_issue_for_requested_bug_feature_or_process_change: true
  not_required_for:
    - read_only_analysis
    - non_behavior_level_1_documentation_cleanup
  branch_required_for_git_changes: task/{issue_key}
  task_branch_completion_route:
    - local_verification
    - commit
    - push
    - pull_request
    - ci_and_review
    - merge_to_main_when_gates_pass
  standing_owner_intent_for_task_branch_push_pr_merge: true
  blocked_gate_stops_merge_and_requires_jira_update: true
  jira_records_material_events:
    - issue_created_or_selected
    - task_branch
    - implementation_started
    - blocker
    - review_or_pr_ready
    - verification_results
    - release_or_deploy_gate
    - final_result
  do_not_comment_each_local_command: true

phases:
  - id: intake
    owner: developer
    inputs:
      - existing_jira_issue_or_clear_request_to_create_one
      - jira_issue
      - comments
      - links_and_blockers
      - parent_or_epic
      - acceptance_criteria
    gate: jira_issue_exists_before_bug_feature_or_behavior_implementation

  - id: validation
    owner: developer
    outputs:
      - plan_or_needs_info
    gate: goal_scope_acceptance_and_verification_are_clear
    blocked_paths:
      needs_info:
        trigger: specific_human_answer_required
        action: prepare_needs_info_and_stop
      blocked:
        trigger: external_dependency_or_technical_gate
        action: record_blocker_and_stop

  - id: risk_classification
    owner: developer
    checks:
      - classify_level_1b_before_planning
      - upgrade_to_level_2_or_3_when_high_risk_gate_is_present

  - id: planning_start
    owner: developer
    skip_for_levels:
      - 1B
    checks:
      - discover_exact_jira_transitions
      - clear_user_intent_before_status_change
      - propose_real_planning_equivalent_when_available

  - id: planning
    owner: developer
    required_outputs:
      level_1b:
        - jira_issue
        - task_branch
        - compact_bugfix_note
      levels_2_3:
        - plan.md
    conditional_outputs:
      - plan-source-context.md
      - plan-review.md
      - test-plan.md
      - architecture-decision-record
    gate: plan_is_specific_and_source_grounded

  - id: plan_review
    owner: plan-reviewer
    activation: required_for_process_level_3_plan
    input_packet: agents/config.yaml#/orchestration_policy/packets/review
    checks:
      - complete_plan_package_only
      - no_partial_slice_reviews
    required_inputs:
      - plan.md
      - plan-source-context.md
    conditional_inputs:
      - proposed_architecture_decision_record
    outputs:
      - plan-review.md
    allowed_statuses:
      - approved
      - changes_requested
      - blocked
    gate: status_is_approved

  - id: plan_publication
    owner: developer
    checks:
      - show_compact_bugfix_note_for_level_1b
      - show_plan_to_user_for_levels_2_3
      - show_plan_review_to_user_when_required
      - show_proposed_adr_to_owner_when_required
      - record_owner_adr_acceptance_before_implementation
      - clear_user_intent_before_jira_comment
      - discover_exact_transition_before_status_change
      - plan_publication_does_not_start_implementation

  - id: git_preparation
    owner: developer
    checks:
      - preserve_user_changes
      - refresh_origin_main
      - create_or_rename_task_branch_before_edits
    branch: task/{issue_key}

  - id: implementation_start
    owner: developer
    checks:
      - clear_user_intent_to_start_implementation
      - discover_exact_jira_transition
      - move_to_real_in_progress_equivalent_when_available
      - planning_and_ready_transitions_optional_for_level_1b
      - required_adr_status_is_accepted

  - id: implementation
    owner: developer
    checks:
      - scoped_change
      - deterministic_rules_in_code
      - idempotency_for_mutations
      - tests_updated_with_behavior
      - documentation_updated

  - id: verification
    owner: developer
    checks:
      - level_1b_reproduction_or_targeted_test
      - level_1b_minimal_smoke_when_applicable
      - targeted_tests
      - required_task_scope_integration_tests
      - key_scenario_smoke
      - control_recheck
      - secret_scan
      - telegram_gates_when_applicable

  - id: report
    owner: developer
    required_outputs:
      level_1b:
        - compact_bugfix_note
      levels_2_3:
        - implementation-report.md
    gate: each_acceptance_and_test_item_has_evidence

  - id: final_review
    owner: final-review
    input_packet: agents/config.yaml#/orchestration_policy/packets/review
    required_inputs:
      - work_request_or_jira_issue
      - repository_diff
      - repository_state
      - verification_evidence
      - relevant_documentation
    level_required_inputs:
      level_1:
        - exact_change_description
      level_1b:
        - jira_issue
        - task_branch
        - compact_bugfix_note
        - reproduction_or_targeted_test
      level_2:
        - jira_issue
        - plan.md
        - implementation-report.md
      level_3:
        - jira_issue
        - plan.md
        - implementation-report.md
        - plan-source-context.md
        - plan-review.md
    conditional_level_3_inputs:
      - test-plan.md
      - architecture-decision-record
    level_outputs:
      level_1:
        - direct_verdict
      level_1b:
        - compact_diff_verdict
      level_2:
        - final-review.md
      level_3:
        - final-review.md
    checks:
      - determine_process_level_from_adr_0004
      - determine_level_1b_from_adr_0010
      - verify_all_conditional_gates_for_process_level
      - reject_level_1b_if_high_risk_gates_are_present
      - require_approved_plan_review_for_level_3
      - complete_implemented_scope_only
      - full_product_regression_is_not_a_per_task_gate
    allowed_statuses:
      - approved
      - changes_requested
      - blocked
    gate: status_is_approved

  - id: handoff
    owner: developer
    output_packet: agents/config.yaml#/orchestration_policy/packets/task
    checks:
      - clear_user_intent_before_remote_mutation
      - jira_comment_states_exact_external_state
      - no_automatic_final_transition

  - id: pull_request_validation
    owner: developer
    waiting_policy: codex.agent-budget.v1#/coordination
    checks:
      - wait_for_ci_and_code_review
      - fixes_require_tests_report_update_and_new_final_review_or_compact_diff_verdict
      - merge_to_main_after_successful_ci_and_review

  - id: memory
    owner: developer
    checks:
      - durable_docs_updated
      - only_non_secret_conclusions_indexed

post_merge_delivery:
  decision: ADR-0019
  deploy_when_diff_contains:
    - deployable_code
    - runtime_config
    - migrations
    - frontend
  skip_when_diff_contains_only:
    - docs
    - tests
    - task_artifacts
  sequence:
    - merge_and_green_main_ci
    - exact_immutable_release_artifact
    - manual_first_single_pilot_activation
    - public_url_smoke
    - privacy_safe_jira_evidence
  migration_change_requires_owner_gate: true
  done_requires: successful_public_smoke_or_documented_owner_waiver
  blocker_without_waiver_is_done: false
  compatible_rollback_tuples: 1
  delivery_is_serialized: true
  supersession_requires_monotonic_artifact_and_both_smoke_scopes: true
  automatic_cd_or_ssh_framework: forbidden

mutation_policy:
  jira_read: allowed_when_requested
  jira_issue_create_for_requested_bug_feature_or_process_change: standing_owner_intent
  jira_write: clear_user_intent_required
  telegram_read: explicit_specific_request_required
  telegram_write: explicit_recipient_and_content_required
  git_push_for_task_branch_after_verification: standing_owner_intent
  pull_request_for_task_branch_after_verification: standing_owner_intent
  merge_task_branch_after_ci_and_review: standing_owner_intent
  merge_when_gate_blocked: forbidden

telegram_testing:
  live_profile_labels:
    - default
    - tg-test
  tg_test_profile_config: config/testing/tg-test.yaml
  safe_probe_command: telegram.ps1 -Profile tg-test probe
  multi_user_live_checks:
    before_use:
      - probe_default_profile_without_message_read
      - probe_tg_test_profile_without_message_read
    evidence_policy:
      - record_profile_label_and_probe_status_only
      - do_not_record_session_strings_phone_numbers_telegram_ids_chat_lists_or_message_text
    live_interactions_require:
      - explicit_user_request_for_the_specific_bot_or_chat
      - deployment_gate_when_claiming_working_instance_acceptance

branching:
  task_flow: task/{issue_key} -> main
  task_branch_must_reach_pr_and_merge_when_gates_pass: true
  direct_task_changes_to_main: forbidden
  bug_feature_or_behavior_branch_without_issue_key: forbidden
  pull_request_base: main
  dev_branch_rule: introduce_only_by_accepted_adr_when_parallel_integration_is_needed

task_sizing:
  default: one_complete_observable_result_with_shared_acceptance
  do_not_split_by:
    - application_layer
    - database_field
    - individual_test
    - current_review_finding
  small_task_exceptions:
    - independent_blocker
    - infrastructure_result_with_own_acceptance
    - bug_first_found_during_full_mvp_regression
    - level_1b_small_reproducible_bugfix

review_retry_policy:
  first_failed_review: fix_all_findings_in_one_cycle_then_one_recheck
  second_failed_review: preserve_both_attempts_create_problem_escalation_and_make_one_consolidated_fix
  failed_review_after_escalation: stop_for_owner_decision
  technical_attempts_threshold_ref: agents/config.yaml#/orchestration_policy/process_limits/technical_attempts_per_problem
  failed_reviews_threshold_per_phase_ref: agents/config.yaml#/orchestration_policy/process_limits/failed_reviews_before_escalation
  post_escalation_reviews_ref: agents/config.yaml#/orchestration_policy/process_limits/post_escalation_reviews

regression_policy:
  per_task: targeted_required_integration_and_smoke_only
  full_product_regression: separate_large_jira_task_after_all_planned_mvp_functionality_is_merged
  bugs_first_found_in_full_regression: separate_jira_bug_and_branch

process_budget:
  normal_task_target_ref: agents/config.yaml#/orchestration_policy/process_limits/normal_overhead_target
  level_1b_target_ref: agents/config.yaml#/orchestration_policy/process_limits/level_1b_overhead_target
  level_1b_max_overhead_ref: agents/config.yaml#/orchestration_policy/process_limits/level_1b_max_overhead
  action_when_exceeded: consolidate_checks_or_escalate

artifacts:
  root: tasks/{issue_key}
  required_before_code:
    level_1b:
      - jira_issue
      - task_branch
      - compact_bugfix_note
    levels_2_3:
      - plan.md
  conditional_before_code:
    - plan-source-context.md
    - plan-review.md
    - test-plan.md
    - implementation-plan.md
    - architecture-decision-record
  required_after_code:
    level_1b:
      - compact_diff_verdict
    levels_2_3:
      - implementation-report.md
      - final-review.md
  optional_after_code:
    - implementation-review.md
  blocking_or_escalation:
    - needs-info.md
    - problem-escalation.md
