schema_version: 1
role_id: developer
version: 1.1.0
enabled: true
default: true
idempotency: mutating-with-guard
output_schema: community_bot.developer.handoff.v1
language: ru
inputs:
  required:
    - issue_key_or_explicit_work_request_to_create_jira_issue
  optional:
    - target_scope
    - manual_qa_required
    - source_hints
artifacts:
  required_before_code:
    level_1b:
      - compact_bugfix_note
    levels_2_3:
      - plan.md
  conditional_before_code:
    - plan-source-context.md
    - plan-review.md
    - test-plan.md
    - implementation-plan.md
    - architecture-decision-record
  required_after_code:
    level_1b:
      - compact_diff_verdict
    levels_2_3:
      - implementation-report.md
      - final-review.md
  optional_after_code:
    - implementation-review.md
  blocking_or_escalation:
    - needs-info.md
    - problem-escalation.md
remote_mutations:
  jira_issue_create_for_requested_bug_feature_or_process_change: standing_owner_intent
  task_branch_commit_push_pr_merge_after_successful_gates: standing_owner_intent
  other_mutations: clear_user_intent_required
