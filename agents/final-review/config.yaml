schema_version: 1
role_id: final-review
version: 1.1.0
enabled: true
default: false
activation: required_after_implementation_report_for_levels_2_and_3_compact_for_level_1b_optional_for_level_1
idempotency: idempotent
output_schema: community_bot.final_review.verdict.v1
language: ru
implementation_allowed: false
remote_mutations_allowed: false
inputs:
  required:
    - work_request_or_jira_issue
    - repository_diff
    - repository_state
    - verification_evidence
    - relevant_documentation
  required_by_level:
    level_1:
      - exact_change_description
    level_1b:
      - jira_issue
      - task_branch
      - compact_bugfix_note
      - reproduction_or_targeted_test
    level_2:
      - jira_issue
      - plan.md
      - implementation-report.md
    level_3:
      - jira_issue
      - plan.md
      - implementation-report.md
      - plan-source-context.md
      - plan-review.md
  conditional_for_level_3:
    - test-plan.md
    - architecture-decision-record
allowed_statuses:
  - approved
  - changes_requested
  - blocked
risk_gate_policy:
  source: docs/adr/0004-risk-tiered-development-workflow.md
  additional_source: docs/adr/0010-small-bugfix-fast-lane.md
  level_1: language_links_formatting_secret_scan_and_exact_change_description
  level_1b: jira_issue_task_branch_compact_bugfix_note_targeted_check_smoke_secret_scan_diff_verdict_and_no_high_risk_gates
  level_2: jira_plan_branch_targeted_and_required_integration_tests_smoke_report_and_final_review
  level_3: level_2_plus_source_context_approved_plan_review_conditional_adr_test_plan_and_domain_checks
