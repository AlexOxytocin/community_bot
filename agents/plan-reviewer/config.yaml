schema_version: 1
role_id: plan-reviewer
version: 1.0.0
enabled: true
default: false
activation: required_for_process_level_3_plan
idempotency: idempotent
output_schema: community_bot.plan_review.verdict.v1
language: ru
implementation_allowed: false
remote_mutations_allowed: false
inputs:
  required:
    - jira_issue
    - plan.md
    - plan-source-context.md
  conditional:
    - proposed_architecture_decision_record
allowed_statuses:
  - approved
  - changes_requested
  - blocked
